<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header>
            <span id="user-name" class="username">Игрок</span>
            <div class="balance-badge">
                🪙 <span id="user-balance">200</span> Креликов
            </div>
        </header>

        <!-- Главная -->
        <main id="tab-home" class="tab-content">
            <button id="btn-open-ai-modal" class="btn btn-blue-bright">
                🤖 Играть с ИИ
            </button>

            <!-- Онлайн игроки -->
            <div class="section-title">🌐 Игроки Онлайн</div>
            <div id="online-players-list" class="lobbies-container">
                <div class="empty-state">Загрузка игроков...</div>
            </div>

            <!-- Входящие вызовы -->
            <div class="section-title">⚔️ Входящие дуэли</div>
            <div id="lobbies-list" class="lobbies-container">
                <div class="empty-state">Нет активных заявок</div>
            </div>
        </main>

        <!-- Модалка выбора сложности ИИ -->
        <div id="modal-ai" class="modal hidden">
            <div class="modal-content">
                <h3>Выбери сложность</h3>
                <button id="btn-ai-easy" class="btn btn-blue-bright">🟢 Легкая</button>
                <button id="btn-ai-hard" class="btn btn-blue-dark">🔴 Сложная (Непобедимый)</button>
                <button id="btn-cancel-ai" class="btn btn-decline" style="margin-top:5px;">Отмена</button>
            </div>
        </div>

        <!-- Модалка информации об игроке -->
        <div id="modal-player-info" class="modal hidden">
            <div class="modal-content">
                <h3 id="info-player-name">Игрок</h3>
                <p style="font-size: 13px; color: #8a9ba8;">Статус: <span style="color:#38ef7d;">В сети 🟢</span></p>
                <div class="modal-actions">
                    <button id="btn-send-challenge" class="btn btn-blue-bright">Кинуть заявку</button>
                    <button id="btn-close-player-info" class="btn btn-blue-dark">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- Экран колеса жеребьёвки -->
        <section id="wheel-area" class="hidden">
            <div class="status-text">Определение первого хода...</div>
            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <div id="wheel" class="wheel">
                    <div class="wheel-sector sector-x">❌</div>
                    <div class="wheel-sector sector-o">⭕</div>
                </div>
            </div>
            <div id="wheel-result" class="status-text" style="margin-top: 15px;"></div>
        </section>

        <!-- Игровое поле -->
        <section id="game-area" class="hidden">
            <div id="game-status" class="status-text">Ход: ❌</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="btn-quit" class="btn btn-blue-dark">Сдаться и выйти</button>
        </section>

        <!-- Модалка конца игры -->
        <div id="modal-game-over" class="modal hidden">
            <div class="modal-content text-center">
                <h2 id="game-over-title">Победа!</h2>
                <div id="game-over-icon" style="font-size: 50px; margin: 10px 0;">🎉</div>
                <p id="game-over-desc" style="color: #8a9ba8; font-size: 14px;"></p>
                <button id="btn-go-home" class="btn btn-blue-bright" style="margin-top: 10px;">Вернуться домой 🏠</button>
            </div>
        </div>

        <!-- Магазин -->
        <main id="tab-shop" class="tab-content hidden">
            <h2 class="page-title">Магазин скинов</h2>
            <div id="shop-list"></div>
        </main>

        <!-- Лидерборд -->
        <main id="tab-leaderboard" class="tab-content hidden">
            <h2 class="page-title">Лидерборд</h2>
            <div id="leaderboard-list">
                <p style="color: #8a9ba8; text-align: center;">Загрузка списка игроков...</p>
            </div>
        </main>

        <!-- Профиль -->
        <main id="tab-profile" class="tab-content hidden">
            <h2 class="page-title">Профиль</h2>
            <div class="profile-card">
                <p>Имя: <b id="prof-name">Игрок</b></p>
                <p>Баланс: <b id="prof-balance">200</b> Креликов</p>
            </div>
        </main>

        <!-- Навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="tab-home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Главная</span>
            </button>
            <button class="nav-btn" data-tab="tab-shop">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Магазин</span>
            </button>
            <button class="nav-btn" data-tab="tab-leaderboard">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Лидерборд</span>
            </button>
            <button class="nav-btn" data-tab="tab-profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
