<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="user-info">
                <span id="user-name">Игрок</span>
            </div>
            <div class="balance-box">
                <span id="user-balance">0</span> 🪙
            </div>
        </header>

        <!-- Главное меню -->
        <main id="main-menu">
            <h1>Крестики-Нолики</h1>
            <button id="btn-pvp" class="btn">Играть PvP</button>
            <button id="btn-ai" class="btn">Играть с ИИ</button>
            <button id="btn-shop" class="btn">Магазин скинов</button>
        </main>

        <!-- Выбор сложности ИИ -->
        <section id="ai-section" class="hidden">
            <h2>Выберите сложность</h2>
            <button class="btn btn-diff" data-diff="easy">Легкий</button>
            <button class="btn btn-diff" data-diff="medium">Средний</button>
            <button class="btn btn-diff" data-diff="hard">Сложный</button>
            <button class="btn-back btn">Назад</button>
        </section>

        <!-- Выбор PvP -->
        <section id="pvp-section" class="hidden">
            <h2>Режим PvP</h2>
            <button id="btn-pvp-friend" class="btn">Играть с другом</button>
            <button class="btn-back btn">Назад</button>
        </section>

        <!-- Игровое поле -->
        <section id="game-area" class="hidden">
            <div class="status" id="game-status">Ход: X</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="btn-quit" class="btn">Выйти</button>
        </section>

        <!-- Магазин -->
        <section id="shop-section" class="hidden">
            <h2>Магазин скинов</h2>
            <div id="shop-list"></div>
            <button class="btn-back btn">Назад</button>
        </section>

        <!-- Модальное окно результата -->
        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <div id="res-icon">🏆</div>
                <h2 id="res-title">Победа!</h2>
                <p id="res-reward">+50 монет 🪙</p>
                <button id="btn-home" class="btn">В меню</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
